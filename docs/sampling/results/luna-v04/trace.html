<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>0.4真实工具轨迹</title><style>body{max-width:1000px;margin:30px auto;padding:0 18px;font:16px/1.7 system-ui;background:#f4f3ee;color:#173234}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px}summary{cursor:pointer;padding:12px;border-bottom:1px solid #ccc}select{font:inherit}details{margin:10px 0}</style><a href="../../#results-v04">← 返回评测结果</a><h1>0.4真实工具轨迹</h1><p>操作与返回已脱敏，不包含隐藏推理、系统提示或受保护传输。记录并不代表操作成功。</p><label>查看 <select id="role"><option value="solver">GPT-6-luna制作</option><option value="judge">GPT-6.1评审</option></select></label><p id="count"></p><main id="entries"></main><script>async function load(){const r=document.querySelector('#role').value;const data=await(await fetch(r+'_trace.json')).json();document.querySelector('#count').textContent=data.entries.length+'次真实工具调用';const parent=document.querySelector('#entries');parent.replaceChildren();for(const x of data.entries){const d=document.createElement('details'),s=document.createElement('summary'),a=document.createElement('pre'),b=document.createElement('pre');s.textContent=x.index+' · '+x.tool+' · '+x.timestamp;a.textContent=typeof x.input==='string'?x.input:JSON.stringify(x.input,null,2);b.textContent=typeof x.output==='string'?x.output:JSON.stringify(x.output,null,2);d.append(s,a,b);parent.append(d)}}document.querySelector('#role').addEventListener('change',load);load();</script></html>
